<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280, height=720" />
  <title>BUZZ BARRIER — Boss motion study</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #040a14; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: #ecf5ff; font-family: system-ui, sans-serif; }
    .clip { position: absolute; inset: 0; }
    header { position: absolute; left: 52px; top: 32px; z-index: 2; }
    .eyebrow { color: #6ed9e9; font-size: 15px; letter-spacing: 3px; margin: 0 0 10px; }
    h1 { font-size: 30px; font-weight: 600; margin: 0; }
    .panel { position: absolute; top: 125px; width: 572px; height: 523px; border: 1px solid #20303f; border-radius: 24px; background: radial-gradient(ellipse at center, #091826 0%, #050c17 72%); }
    .left { left: 44px; } .right { left: 664px; }
    .panel h2 { position: absolute; left: 26px; top: 14px; font-size: 24px; font-weight: 600; z-index: 2; }
    .left h2 { color: #71dfec; } .right h2 { color: #c7a7ff; }
    .note { position: absolute; left: 26px; bottom: 22px; font-size: 19px; color: #b2c3d6; margin: 0; line-height: 1.7; z-index: 2; }
    #boss-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    footer { position: absolute; left: 52px; bottom: 23px; color: #8c9eb4; font-size: 15px; z-index: 2; }
  </style>
</head>
<body>
  <div data-hf-id="hf-xo0l" id="root" data-composition-id="boss-motion" data-start="0" data-duration="9.6" data-width="1280" data-height="720">
    <section data-hf-id="hf-nn20" id="study" class="clip" data-start="0" data-duration="9.6" data-track-index="0">
      <header data-hf-id="hf-0drs"><p data-hf-id="hf-daji" class="eyebrow">BUZZ BARRIER / MOTION STUDY</p><h1 data-hf-id="hf-e96w">ボスの動き・実装前プレビュー</h1></header>
      <div data-hf-id="hf-ajkl" class="panel left"><h2 data-hf-id="hf-utwh">ボス1：球体</h2><p data-hf-id="hf-mehe" class="note">位置は固定 / ゆっくり回転</p></div>
      <div data-hf-id="hf-wm48" class="panel right"><h2 data-hf-id="hf-yn8z">ラスボス：結晶体</h2><p data-hf-id="hf-6k11" class="note">6本のトゲが2.4秒周期で伸縮・全体が回転</p></div>
      <canvas data-hf-id="hf-dm4y" id="boss-canvas"></canvas>
      <footer data-hf-id="hf-570z">形の変化を見やすく拡大表示しています。ゲーム本体は未変更です。</footer>
    </section>
  </div>
  <script>
    const clock = { time: 0 };
    const timeline = gsap.timeline({ paused: true });
    timeline.to(clock, { time: 9.6, duration: 9.6, ease: "none", onUpdate() { window.renderBossPreview?.(clock.time); } });
    window.__timelines["boss-motion"] = timeline;
    timeline.seek(0);
  </script>
  <script type="module" src="./scene.js"></script>
</body>
</html>
