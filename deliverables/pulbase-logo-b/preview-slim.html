<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PULBASE B — 太さの比較</title><style>*{box-sizing:border-box}body{background:#ededeb;color:#222;margin:0;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:30px}h1{font-size:24px;margin:0 0 12px}p{font-size:14px;line-height:1.8;color:#555}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:#111;color:white;border-radius:10px;padding:24px}h2{font-size:17px;margin:0}.large{width:220px;height:220px;display:block;margin:24px auto 10px}.word{text-align:center;font-size:25px;font-weight:700;letter-spacing:.24em}.icons{display:flex;gap:32px;align-items:center;justify-content:center;margin:36px 0}.icons>div{display:flex;gap:12px;align-items:center}.icons span{font-size:12px;color:#aaa}.header{border-top:1px solid #444;padding-top:24px;display:flex;gap:12px;align-items:center;justify-content:center}.header img{width:48px;height:48px}.header strong{font-size:36px}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:20px}}</style><main><h1>PULBASE B — Pの線をほんの少し細く</h1><p>輪郭と稲妻の形は維持し、Pの上下・左右の線を約7〜10%細くした比較です。丸い抜きの半径は同じ。下段は実寸faviconとヘッダーの仮組み。</p><div class="grid"><section><h2>現行</h2><img class="large" src="pulbase-b-white.svg"><div class="word">PULBASE</div><div class="icons"><div><img width="16" height="16" src="favicon-dark-16.png"><span>16px</span></div><div><img width="32" height="32" src="favicon-dark-32.png"><span>32px</span></div></div><div class="header"><img src="pulbase-b-white.svg"><strong>PULBASE</strong></div></section><section><h2>少し細く</h2><img class="large" src="pulbase-b-slim-white.svg"><div class="word">PULBASE</div><div class="icons"><div><img width="16" height="16" src="favicon-slim-dark-16.png"><span>16px</span></div><div><img width="32" height="32" src="favicon-slim-dark-32.png"><span>32px</span></div></div><div class="header"><img src="pulbase-b-slim-white.svg"><strong>PULBASE</strong></div></section></div><p>16pxでは細い隙間の読み取りに限界があります。サイトへの適用はまだ行っていません。</p></main></html>
