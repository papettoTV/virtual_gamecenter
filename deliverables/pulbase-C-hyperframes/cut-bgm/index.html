 story.to(target,{x:-760,duration:exit,ease:'power2.in'},start+enter+center);
});
story.to('#action',{scale:.94,duration:.16,ease:'power1.in'},8.25);
story.to('#action',{scale:1,duration:.40,ease:'back.out(1.4)'},8.41);

story.set('#duel',{opacity:0},15.22);
