<div id="root" data-composition-id="c-cut" data-start="0" data-duration="24" data-width="1080" data-height="1920">
<div id="world">

<div id="invite">

<div id="context">休憩中に、友だちから。</div>
<div id="message"><div id="sender">友だち · いま</div><div id="message-copy"><span>いまプレイ中！</span><span>挑戦者募集してます！</span></div></div>

</div>

<div class="duel-panel self"><video id="self-game" class="clip" src="assets/buzz-duel-self-6p5s.mp4" data-start="17.5" data-duration="6.5" data-track-index="3" muted playsinline></video><div class="role">自分</div></div>

</div></div>
<script>
const tl=gsap.timeline({paused:true});
tl.fromTo('#arcade-bg',{scale:1.04},{scale:1.10,duration:5.82,ease:'none'},0);
tl.fromTo('#message',{x:75,opacity:0},{x:0,opacity:1,duration:.5,ease:'power2.out'},.12);
tl.fromTo('#url-card',{y:24,opacity:0},{y:0,opacity:1,duration:.48,ease:'power2.out'},.45);
// Hold the invitation, then open its URL with a clear tactile reaction.
tl.to('#url-card',{scale:.96,duration:.18,ease:'power1.in'},4.72);
tl.to('#url-card',{scale:1,duration:.42,ease:'back.out(1.4)'},4.90);
tl.fromTo('#open-ripple',{scale:.5,opacity:0},{scale:1.3,opacity:.8,duration:.18,ease:'power2.out'},4.74);
tl.to('#open-ripple',{scale:1.8,opacity:0,duration:.38,ease:'power2.out'},4.92);
tl.to('#open-link',{color:'#56deed',duration:.18},4.90);
tl.to('#intro-note',{opacity:0,duration:.2},5.25);
tl.to('#invite',{opacity:0,duration:.32,ease:'power2.in'},5.5);
tl.fromTo('#screen-visual',{clipPath:'inset(35% 7% 15% 7% round 20px)'},{clipPath:'inset(0% 0% 0% 0% round 0px)',duration:.55,ease:'power2.out'},5.5);
tl.to('#dock',{opacity:1,duration:.32},5.55);
// Slow central right-to-left captions; actual gameplay continues underneath.
const beats=[['#s0',5.75,3.9],['#s2',10.25,5.45],['#closing',17.58,4.12]];
beats.forEach(([target,start,span])=>{const enter=.50,exit=.50,center=span-enter-exit;
 tl.fromTo(target,{x:760,opacity:1},{x:75,opacity:1,duration:enter,ease:'power2.out'},start);
 tl.to(target,{x:-75,duration:center,ease:'none'},start+enter);
 tl.to(target,{x:-760,duration:exit,ease:'power2.in'},start+enter+center);
});
tl.to('#action',{scale:.94,duration:.16,ease:'power1.in'},13.25);
tl.to('#action',{scale:1,duration:.40,ease:'back.out(1.4)'},13.41);
tl.fromTo('#ripple',{scale:.5,opacity:0},{scale:1.3,opacity:.8,duration:.18,ease:'power2.out'},13.25);
tl.to('#ripple',{scale:1.8,opacity:0,duration:.34,ease:'power2.out'},13.43);
tl.to('#challenge',{opacity:0,duration:.12},13.45);
tl.to('#waiting',{opacity:1,duration:.12},13.57);
tl.to('#action',{backgroundColor:'#303446',borderColor:'#ed62a8',color:'#fff8ee',duration:.25},13.45);
tl.to('#dock',{backgroundColor:'#211424',duration:1.2,ease:'power2.out'},13.45);
tl.to('#accept',{opacity:1,duration:.25},16.18);
tl.to('#action',{borderColor:'#56deed',duration:.25},16.18);
// Only the authored surroundings gain color; game pixels remain authentic.
tl.fromTo('#color-wave',{svgOrigin:'360 1160',scale:.2,opacity:0},{svgOrigin:'360 1160',scale:29,opacity:1,duration:1.45,ease:'power2.out'},16.18);
tl.to('#duel',{opacity:1,duration:.18},17.5);
tl.to('#screen',{opacity:0,duration:.18},17.5);
tl.to('#dock',{opacity:0,duration:.18},17.5);
tl.fromTo('#brand',{y:12,opacity:0},{y:0,opacity:1,duration:.28,ease:'power2.out'},21.72);
window.__timelines=window.__timelines||{};window.__timelines['c-cut']=tl;
</script></body></html>
