# Registration-only definition for develop. The ci-control branch has the real rehearsal definition.
name: 検証公開制御の鍵なし予行試験
on:
  workflow_dispatch:
permissions: {}
jobs:
  registration-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: 公開制御ブランチ以外では実行しない
        run: |
          echo 'この定義は登録専用です。実行元には保護済みci-controlを指定してください。公開・Secret参照は行いません。'
          exit 1
