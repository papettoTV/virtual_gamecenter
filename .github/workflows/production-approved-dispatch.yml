name: 本番リリースの承認待ちを自動作成
on:
  workflow_run:
    workflows: [developマージ後の検証公開と回帰, 本番準備の検査（公開なし）]
    types: [completed]
    branches: [develop, ci-control]
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions: {}
concurrency:
  group: production-approved-dispatch
  cancel-in-progress: false
jobs:
  discover:
    if: >-
      vars.PULBASE_PRODUCTION_ENABLED == 'false' &&
      vars.PULBASE_PRODUCTION_CD_REHEARSAL == 'true' &&
      github.run_attempt == 1 &&
      (github.event_name == 'schedule' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.run_attempt == 1 &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      candidate: ${{ steps.candidate.outputs.candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: developの初回CIと検証・本番準備の成功を照合
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PULBASE_EXPECTED_CONTROL_SHA: ${{ vars.PULBASE_CONTROL_EVIDENCE_SHA }}
        run: node ci/production-candidate/discover.mjs
  dispatch:
    needs: discover
    if: needs.discover.outputs.candidate != ''
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 固定したci-controlに本番承認の実行を起動
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.discover.outputs.candidate }}
          EXPECTED_CONTROL_SHA: ${{ vars.PULBASE_CONTROL_EVIDENCE_SHA }}
        run: |
          node --input-type=module <<'JS'
          const { sha, mainSha, controlSha, ciRunId, stagingRunId, preparationRunId } = JSON.parse(process.env.CANDIDATE);
          if (![sha, mainSha, controlSha].every(x => typeof x === 'string' && /^[a-f0-9]{40}$/.test(x))
              || sha === mainSha || controlSha !== process.env.EXPECTED_CONTROL_SHA
              || ![ciRunId, stagingRunId, preparationRunId].every(x => Number.isSafeInteger(x) && x > 0)) {
            throw Error('起動対象が不正です。');
          }
          const repo = 'https://api.github.com/repos/papettoTV/virtual_gamecenter/';
          const options = {
            headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json',
                       'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
            redirect: 'error', signal: AbortSignal.timeout(15000),
          };
          for (const [branch, expected] of [['develop', sha], ['main', mainSha], ['ci-control', controlSha]]) {
            const response = await fetch(repo + 'git/ref/heads/' + branch, options);
            if (!response.ok || (await response.json()).object?.sha !== expected) {
              throw Error('候補照合後にブランチが変わりました。');
            }
          }
          const file = 'actions/workflows/production-approved-release.yml';
          const response = await fetch(repo + file + '/dispatches', {
            ...options, method: 'POST', body: JSON.stringify({ ref: 'ci-control', inputs: {
              sha, main_sha: mainSha, ci_run_id: String(ciRunId), staging_run_id: String(stagingRunId),
              preparation_run_id: String(preparationRunId),
            } }),
          });
          if (!response.ok) throw Error('保護された本番ワークフローを起動できません。');
          for (let attempt = 0; attempt < 12; attempt += 1) {
            const observed = await fetch(repo + file + '/runs?branch=ci-control&per_page=30', options);
            if (!observed.ok) throw Error('本番候補の起動結果を確認できません。');
            const { workflow_runs } = await observed.json();
            if (workflow_runs.some(run => run.head_sha === controlSha && run.display_title === '本番候補 ' + sha)) {
              console.log('本番候補 ' + sha + ' の実行を起動しました。');
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          throw Error('起動の反映を確認できません。');
          JS
