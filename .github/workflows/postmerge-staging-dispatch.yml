name: developマージ後の検証を自動起動
on:
  workflow_run:
    workflows: [Web checks]
    types: [requested, completed]
    branches: [develop]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: >-
      vars.PULBASE_CONTROL_EVIDENCE_ENABLED == 'true' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt == 1 &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: 古くなった公開前のstaging承認待ちだけを整理
        id: cleanup
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CONTROL_SHA: ${{ vars.PULBASE_CONTROL_EVIDENCE_SHA }}
        run: node ci/stale-staging-runs.mjs --apply > stale-staging-cleanup.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stale-staging-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: stale-staging-cleanup.json
          if-no-files-found: error
          retention-days: 7
      - name: 保護されたci-controlでマージ後の検証を起動
        if: github.event.action == 'completed' && github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          THIS_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_CONTROL_SHA: ${{ vars.PULBASE_CONTROL_EVIDENCE_SHA }}
        run: |
          node --input-type=module <<'JS'
          const id=process.env.CI_RUN_ID;
          if(!/^[1-9][0-9]*$/.test(id)||process.env.SOURCE_ATTEMPT!=='1'||process.env.THIS_ATTEMPT!=='1'||!/^[a-f0-9]{40}$/.test(process.env.EXPECTED_CONTROL_SHA)||!/^[a-f0-9]{40}$/.test(process.env.SOURCE_SHA))throw Error('初回runと固定制御SHAが必要です');
          const base='https://api.github.com/repos/papettoTV/virtual_gamecenter/';
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const develop=await fetch(base+'git/ref/heads/develop',{headers,redirect:'error',signal:AbortSignal.timeout(15000)});
          if(!develop.ok)throw Error('developを確認できません');
          if((await develop.json()).object?.sha!==process.env.SOURCE_SHA){console.log('古いdevelopの成功CIなので新しい公開待ちを作成しません。');process.exit(0);}
          const ref=await fetch(base+'git/ref/heads/ci-control',{headers,redirect:'error',signal:AbortSignal.timeout(15000)});
          if(!ref.ok||(await ref.json()).object?.sha!==process.env.EXPECTED_CONTROL_SHA)throw Error('制御SHA不一致');
          const r=await fetch(base+'actions/workflows/postmerge-staging.yml/dispatches',{method:'POST',headers:{...headers,'Content-Type':'application/json'},redirect:'error',signal:AbortSignal.timeout(15000),body:JSON.stringify({ref:'ci-control',inputs:{ci_run_id:id}})});
          if(r.status!==204)throw Error('起動できません。自動再試行はしません');
          console.log('developの同一SHAの検証を起動しました。staging承認を待ちます。');
          JS
      - name: 整理に失敗した場合は公開起動と区別して通知
        if: always() && steps.cleanup.outcome == 'failure'
        run: |
          echo '古い承認待ちの整理は未確認です。成果物を確認してください。現在SHAの公開起動とは別の結果です。'
          exit 1
