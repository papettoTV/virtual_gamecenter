name: Develop staging deployment
on:
  workflow_run:
    workflows: [Web checks]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 成果物と公開条件だけを確認する（Worker・Pagesは公開しない）
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: pulbase-staging-pipeline
  cancel-in-progress: false
jobs:
  ready:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && github.actor == 'papettoTV') ||
      (github.event_name == 'workflow_run' && vars.PULBASE_STAGING_DEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tree: ${{ steps.identity.outputs.tree }}
      run_id: ${{ steps.ci.outputs.runId }}
      attempt: ${{ steps.ci.outputs.attempt }}
      artifact_id: ${{ steps.ci.outputs.artifactId }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record immutable develop identity
        id: identity
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Require successful CI and artifact for this exact develop SHA
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          PULBASE_CHECK_SHA: ${{ steps.identity.outputs.sha }}
          PULBASE_RELEASE_SHA: ${{ steps.identity.outputs.sha }}
          PULBASE_EXPECTED_BASE: ${{ steps.identity.outputs.sha }}
          PULBASE_CI_EVENT: push
          PULBASE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node ci/ci-evidence.mjs
  staging:
    needs: ready
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ready.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked deploy tools without lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: apps/web
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.ready.outputs.artifact_id }}
          run-id: ${{ needs.ready.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ci/downloaded-build
          merge-multiple: true
      - name: Recheck CI and deploy artifact without building candidate code
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && secrets.CLOUDFLARE_API_TOKEN || '' }}
          PULBASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          PULBASE_CHECK_SHA: ${{ needs.ready.outputs.sha }}
          PULBASE_RELEASE_SHA: ${{ needs.ready.outputs.sha }}
          PULBASE_EXPECTED_BASE: ${{ needs.ready.outputs.sha }}
          PULBASE_EXPECTED_TREE: ${{ needs.ready.outputs.tree }}
          PULBASE_CI_EVENT: push
          PULBASE_CI_RUN_ID: ${{ needs.ready.outputs.run_id }}
          PULBASE_CI_ATTEMPT: ${{ needs.ready.outputs.attempt }}
          PULBASE_ARTIFACT_ID: ${{ needs.ready.outputs.artifact_id }}
        run: node ci/deploy-staging-artifact.mjs
  regression:
    needs: [ready, staging]
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ready.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: ci
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: ci
      - name: HTTP and exact deployed revision
        env:
          PULBASE_CHECK_USERNAME: ${{ secrets.PULBASE_CHECK_USERNAME }}
          PULBASE_CHECK_PASSWORD: ${{ secrets.PULBASE_CHECK_PASSWORD }}
          PULBASE_EXPECTED_SHA: ${{ needs.ready.outputs.sha }}
        run: |
          mkdir -p ci/results
          node --experimental-strip-types apps/web/scripts/service-check.mjs --environment staging > ci/results/service.json
          node ci/check-revision.mjs staging
      - name: Browser regression on desktop and mobile
        working-directory: ci
        env:
          PULBASE_BROWSER_ENVIRONMENT: staging
          PULBASE_CHECK_USERNAME: ${{ secrets.PULBASE_CHECK_USERNAME }}
          PULBASE_CHECK_PASSWORD: ${{ secrets.PULBASE_CHECK_PASSWORD }}
          PULBASE_EXPECTED_SHA: ${{ needs.ready.outputs.sha }}
        run: npm run browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-evidence-${{ needs.ready.outputs.sha }}
          path: |
            ci/results
            ci/test-results
            ci/playwright-report
          retention-days: 14
          if-no-files-found: warn
