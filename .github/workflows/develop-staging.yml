name: Develop staging deployment
on:
  push:
    branches:
      - develop
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: pulbase-staging-pipeline
  cancel-in-progress: false
jobs:
  staging:
    if: >-
      github.ref == 'refs/heads/develop' &&
      ((github.event_name == 'workflow_dispatch' && github.actor == 'papettoTV') ||
       (github.event_name == 'push' && vars.PULBASE_STAGING_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: apps/web
      - run: npm ci
        working-directory: ci
      - run: npx playwright install --with-deps chromium
        working-directory: ci
      - name: Confirm develop has not moved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_BASE: ${{ github.sha }}
        run: test "$(gh api "repos/$GH_REPO/git/ref/heads/develop" --jq .object.sha)" =
          "$EXPECTED_BASE"
      - name: Require staging access and disabled Pages preview auto-deploy before building
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node ../../ci/staging-preflight.mjs
          node ../../ci/check-pages.mjs staging
      - name: Build stamped staging candidate without deployment credentials
        working-directory: apps/web
        env:
          PULBASE_RELEASE_SHA: ${{ github.sha }}
        run: |
          git checkout -B develop
          printf '%s\n' 'GOOGLE_CLIENT_ID=ci-example.apps.googleusercontent.com' 'GOOGLE_CLIENT_SECRET=ci-example' 'STRIPE_SECRET_KEY=sk_test_ci_example' 'STRIPE_WEBHOOK_SECRET=whsec_ci_example' > .dev.vars
          npm test
          npm run build:staging
      - name: Deploy verified candidate to staging only
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PULBASE_RELEASE_SHA: ${{ github.sha }}
        run: |
          node ../../ci/deploy-built.mjs staging
      - name: Check deployed identity and public HTTP routes
        working-directory: apps/web
        env:
          PULBASE_CHECK_USERNAME: ${{ secrets.PULBASE_CHECK_USERNAME }}
          PULBASE_CHECK_PASSWORD: ${{ secrets.PULBASE_CHECK_PASSWORD }}
          PULBASE_EXPECTED_SHA: ${{ github.sha }}
        run: >
          mkdir -p ../../ci/results

          node --experimental-strip-types scripts/service-check.mjs --environment staging >
          ../../ci/results/service.json

          node ../../ci/check-revision.mjs staging
      - name: Browser regression on desktop and mobile
        working-directory: ci
        env:
          PULBASE_BROWSER_ENVIRONMENT: staging
          PULBASE_CHECK_USERNAME: ${{ secrets.PULBASE_CHECK_USERNAME }}
          PULBASE_CHECK_PASSWORD: ${{ secrets.PULBASE_CHECK_PASSWORD }}
          PULBASE_EXPECTED_SHA: ${{ github.sha }}
        run: npm run browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-evidence-${{ github.sha }}
          path: |
            ci/results
            ci/test-results
            ci/playwright-report
          retention-days: 14
          if-no-files-found: warn
