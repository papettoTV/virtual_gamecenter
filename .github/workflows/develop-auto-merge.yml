name: Codexレビュー成功後にdevelopへ自動マージ
on:
  workflow_run:
    workflows: [Codex PR verification]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: pulbase-develop-auto-merge
  cancel-in-progress: false
jobs:
  locate:
    if: >-
      vars.PULBASE_CODEX_ENABLED == 'true' &&
      vars.PULBASE_DEVELOP_AUTO_MERGE_ENABLED == 'true' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.receipt.outputs.eligible }}
      receipt_id: ${{ steps.receipt.outputs.receipt_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      PULBASE_CODEX_ENABLED: ${{ vars.PULBASE_CODEX_ENABLED }}
      PULBASE_DEVELOP_AUTO_MERGE_ENABLED: ${{ vars.PULBASE_DEVELOP_AUTO_MERGE_ENABLED }}
      EXPECTED_CONTROL_SHA: ${{ vars.PULBASE_CONTROL_EVIDENCE_SHA }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '1919c95b933d9b820b6db7bc54572020923c9849'
          path: fixed-control
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: 固定制御コードでstrict保護と初回レビュー証跡の出所を照合
        id: receipt
        run: node ci/develop-auto-merge.mjs locate
  merge:
    needs: locate
    if: needs.locate.outputs.eligible == 'true'
    environment: automation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      PULBASE_CODEX_ENABLED: ${{ vars.PULBASE_CODEX_ENABLED }}
      PULBASE_DEVELOP_AUTO_MERGE_ENABLED: ${{ vars.PULBASE_DEVELOP_AUTO_MERGE_ENABLED }}
      EXPECTED_CONTROL_SHA: ${{ vars.PULBASE_CONTROL_EVIDENCE_SHA }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '1919c95b933d9b820b6db7bc54572020923c9849'
          path: fixed-control
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.locate.outputs.receipt_id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: receipt
          merge-multiple: true
      - name: 既存の開発用App認証を対象リポジトリだけに限定
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        id: app
        with:
          app-id: '5403155'
          private-key: ${{ secrets.PULBASE_APP_PRIVATE_KEY }}
          owner: papettoTV
          repositories: virtual_gamecenter
      - name: 同じ候補のCI・独立レビュー・現在のdevelopを再照合してマージ
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: node ci/develop-auto-merge.mjs merge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: develop-merge-${{ github.run_id }}-${{ github.run_attempt }}
          path: develop-merge-result.json
          if-no-files-found: warn
          retention-days: 7
