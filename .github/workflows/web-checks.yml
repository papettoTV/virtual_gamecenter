name: Web checks
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    env:
      PULBASE_TARGET_ENVIRONMENT: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Check Pages branch and environment mapping
        run: npm run pages:target:check -- "$PULBASE_TARGET_ENVIRONMENT"
      - name: Configure disposable local test credentials
        run: |
          printf '%s\n' 'GOOGLE_CLIENT_ID=ci-example.apps.googleusercontent.com' 'GOOGLE_CLIENT_SECRET=ci-example' 'STRIPE_SECRET_KEY=sk_test_ci_example' 'STRIPE_WEBHOOK_SECRET=whsec_ci_example' > .dev.vars
      - run: npm test
      - name: Verify DOT WAVE integration stability without retries
        run: |
          for iteration in 1 2 3; do
            echo "DOT WAVE stability run $iteration/3"
            npm run test:dot-wave
          done
      - name: Build for the target environment without deploying
        env:
          PULBASE_RELEASE_SHA: ${{ github.sha }}
        run: npm run build:${PULBASE_TARGET_ENVIRONMENT}
      - name: Package stamped staging build without credentials
        if: env.PULBASE_TARGET_ENVIRONMENT == 'staging'
        working-directory: .
        env:
          PULBASE_RELEASE_SHA: ${{ github.sha }}
        run: node ci/staging-artifact.mjs
      - uses: actions/upload-artifact@v4
        if: env.PULBASE_TARGET_ENVIRONMENT == 'staging'
        with:
          name: staging-build-${{ github.sha }}-${{ github.run_attempt }}
          path: ci/staging-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  automation-control:
    name: Automation control checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run check
