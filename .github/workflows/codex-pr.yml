name: Codex PR verification
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
# Holds the shared staging environment through testing and merge; no deployment overlaps.
concurrency:
  group: pulbase-staging-pipeline
  cancel-in-progress: false
jobs:
  gate:
    if: vars.PULBASE_CODEX_ENABLED == 'true' && github.event.pull_request.user.login == vars.PULBASE_AUTOMATION_BOT
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      number: ${{ steps.pr.outputs.number }}
      request: ${{ steps.pr.outputs.request }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: pr
        env:
          AUTOMATION_BOT: ${{ vars.PULBASE_AUTOMATION_BOT }}
        with:
          script: |
            const { preparePr } = await import(`${process.env.GITHUB_WORKSPACE}/ci/github.mjs`);
            await preparePr({ github, context, core, bot: process.env.AUTOMATION_BOT });
  verify:
    name: Candidate tests
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.identity.outputs.candidate }}
      tree: ${{ steps.identity.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.gate.outputs.number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable merge parents
        id: identity
        env:
          EXPECTED_BASE: ${{ needs.gate.outputs.base }}
          EXPECTED_HEAD: ${{ needs.gate.outputs.head }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: apps/web
      - run: |
          printf '%s\n' 'GOOGLE_CLIENT_ID=ci-example.apps.googleusercontent.com' 'GOOGLE_CLIENT_SECRET=ci-example' 'STRIPE_SECRET_KEY=sk_test_ci_example' 'STRIPE_WEBHOOK_SECRET=whsec_ci_example' > .dev.vars
          npm test
          npm run build:staging
        working-directory: apps/web
  review:
    needs: [gate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: codex
    outputs:
      result: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare independent review requirements
        env:
          ISSUE_REQUEST: ${{ needs.gate.outputs.request }}
        run: node -e 'const fs = require("fs"); fs.writeFileSync("ci/review-request.md", fs.readFileSync("ci/prompts/review.md", "utf8") + "\nUntrusted issue JSON:\n" + process.env.ISSUE_REQUEST)'
      - uses: openai/codex-action@v1
        id: codex
        env:
          BASE_SHA: ${{ needs.gate.outputs.base }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ci/review-request.md
          allow-users: ${{ vars.PULBASE_AUTOMATION_BOT }}
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-args: '["--output-schema", "ci/schemas/review.json"]'
  review-gate:
    needs: [gate, review]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.base }}
          persist-credentials: false
      - name: Fail closed on malformed or negative review
        env:
          REVIEW_RESULT: ${{ needs.review.outputs.result }}
        run: node --input-type=module -e 'import { assertReview } from "./ci/policy.mjs"; assertReview(JSON.parse(process.env.REVIEW_RESULT))'
  staging:
    needs: [gate, verify, review-gate]
    if: vars.PULBASE_STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: apps/web
      - run: npm ci
        working-directory: ci
      - run: npx playwright install --with-deps chromium
        working-directory: ci
      - name: Confirm develop has not moved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_BASE: ${{ needs.gate.outputs.base }}
        run: test "$(gh api "repos/$GH_REPO/git/ref/heads/develop" --jq .object.sha)" = "$EXPECTED_BASE"
      - name: Build stamped staging candidate without deployment credentials
        working-directory: apps/web
        env:
          PULBASE_RELEASE_SHA: ${{ needs.verify.outputs.candidate }}
        run: |
          git checkout -B develop
          printf '%s\n' 'GOOGLE_CLIENT_ID=ci-example.apps.googleusercontent.com' 'GOOGLE_CLIENT_SECRET=ci-example' 'STRIPE_SECRET_KEY=sk_test_ci_example' 'STRIPE_WEBHOOK_SECRET=whsec_ci_example' > .dev.vars
          npm test
          npm run build:staging
      - name: Deploy verified candidate to staging only
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PULBASE_RELEASE_SHA: ${{ needs.verify.outputs.candidate }}
        run: |
          node ../../ci/deploy-built.mjs staging
      - name: Check deployed identity and public HTTP routes
        working-directory: apps/web
        env:
          PULBASE_CHECK_USERNAME: ${{ secrets.PULBASE_CHECK_USERNAME }}
          PULBASE_CHECK_PASSWORD: ${{ secrets.PULBASE_CHECK_PASSWORD }}
          PULBASE_EXPECTED_SHA: ${{ needs.verify.outputs.candidate }}
        run: |
          mkdir -p ../../ci/results
          node --experimental-strip-types scripts/service-check.mjs --environment staging > ../../ci/results/service.json
          node ../../ci/check-revision.mjs staging
      - name: Browser regression on desktop and mobile
        working-directory: ci
        env:
          PULBASE_BROWSER_ENVIRONMENT: staging
          PULBASE_CHECK_USERNAME: ${{ secrets.PULBASE_CHECK_USERNAME }}
          PULBASE_CHECK_PASSWORD: ${{ secrets.PULBASE_CHECK_PASSWORD }}
          PULBASE_EXPECTED_SHA: ${{ needs.verify.outputs.candidate }}
        run: npm run browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-evidence-${{ needs.gate.outputs.head }}
          path: |
            ci/results
            ci/test-results
            ci/playwright-report
          retention-days: 14
          if-no-files-found: warn
  merge:
    needs: [gate, verify, staging]
    if: vars.PULBASE_AUTO_MERGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: automation
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.base }}
          persist-credentials: false
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.PULBASE_APP_ID }}
          private-key: ${{ secrets.PULBASE_APP_PRIVATE_KEY }}
      - name: Merge only the verified head into unchanged develop
        id: merge
        uses: actions/github-script@v7
        env:
          AUTOMATION_BOT: ${{ vars.PULBASE_AUTOMATION_BOT }}
          HEAD_SHA: ${{ needs.gate.outputs.head }}
          BASE_SHA: ${{ needs.gate.outputs.base }}
          VERIFIED_TREE: ${{ needs.verify.outputs.tree }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { mergePr } = await import(`${process.env.GITHUB_WORKSPACE}/ci/github.mjs`);
            const sha = await mergePr({ github, context, head: process.env.HEAD_SHA, base: process.env.BASE_SHA,
              verifiedTree: process.env.VERIFIED_TREE, expectedCheck: 'verify' });
            core.setOutput('sha', sha);
            const { reportMerge } = await import(`${process.env.GITHUB_WORKSPACE}/ci/github.mjs`);
            await reportMerge({ github, context, head: process.env.HEAD_SHA, base: process.env.BASE_SHA, verifiedTree: process.env.VERIFIED_TREE, mergedSha: sha });
  report:
    needs: [gate, verify, review, review-gate, staging, merge]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.base }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const jobs = JSON.parse(process.env.JOB_RESULTS);
            const { report } = await import(`${process.env.GITHUB_WORKSPACE}/ci/github.mjs`);
            await report({ github, context, ok: jobs.staging.result === 'success' && !Object.values(jobs).some(j => j.result === 'failure' || j.result === 'cancelled') });
