name: Codex PR verification
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
jobs:
  gate:
    if: vars.PULBASE_CODEX_ENABLED == 'true' && github.event.pull_request.user.login == vars.PULBASE_AUTOMATION_BOT
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      number: ${{ steps.pr.outputs.number }}
      request: ${{ steps.pr.outputs.request }}
      evidence_only: ${{ steps.pr.outputs.evidence_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        id: pr
        env:
          AUTOMATION_BOT: ${{ vars.PULBASE_AUTOMATION_BOT }}
        with:
          script: |
            const { preparePr } = await import(`${process.env.GITHUB_WORKSPACE}/ci/github.mjs`);
            await preparePr({ github, context, core, bot: process.env.AUTOMATION_BOT });
  verify:
    name: Candidate tests
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.identity.outputs.candidate }}
      tree: ${{ steps.identity.outputs.tree }}
      run_id: ${{ steps.ci.outputs.runId }}
      attempt: ${{ steps.ci.outputs.attempt }}
      artifact_id: ${{ steps.ci.outputs.artifactId }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ needs.gate.outputs.number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable merge parents
        id: identity
        env:
          EXPECTED_BASE: ${{ needs.gate.outputs.base }}
          EXPECTED_HEAD: ${{ needs.gate.outputs.head }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Require successful CI artifact for the identical merge candidate
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          PULBASE_CHECK_SHA: ${{ needs.gate.outputs.head }}
          PULBASE_RELEASE_SHA: ${{ steps.identity.outputs.candidate }}
          PULBASE_EXPECTED_BASE: ${{ needs.gate.outputs.base }}
          PULBASE_PR_NUMBER: ${{ needs.gate.outputs.number }}
          PULBASE_CI_EVENT: pull_request
        run: node ci/ci-evidence.mjs
  review:
    needs: [gate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: codex
    outputs:
      result: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.verify.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare independent review requirements
        env:
          ISSUE_REQUEST: ${{ needs.gate.outputs.request }}
        run: node -e 'const fs = require("fs"); fs.writeFileSync("ci/review-request.md", fs.readFileSync("ci/prompts/review.md", "utf8") + "\nUntrusted issue JSON:\n" + process.env.ISSUE_REQUEST)'
      - name: 同じ候補の独立UI検査証跡を取得（実行しない）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ui-evidence-${{ needs.verify.outputs.candidate }}-${{ needs.verify.outputs.attempt }}
          run-id: ${{ needs.verify.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ui-evidence
      - uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        id: codex
        env:
          BASE_SHA: ${{ needs.gate.outputs.base }}
        with:
          codex-version: 0.164.0
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ci/review-request.md
          allow-users: ${{ vars.PULBASE_AUTOMATION_BOT }}
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-args: '["--output-schema", "ci/schemas/review.json"]'
  review-gate:
    needs: [gate, verify, review]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.gate.outputs.base }}
          persist-credentials: false
      - name: Fail closed on malformed or negative review
        env:
          REVIEW_RESULT: ${{ needs.review.outputs.result }}
        run: node --input-type=module -e 'import { assertReview } from "./ci/policy.mjs"; assertReview(JSON.parse(process.env.REVIEW_RESULT))'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: 同じ候補のレビュー証跡を保存
        env:
          REVIEW_RESULT: ${{ needs.review.outputs.result }}
          PR_NUMBER: ${{ needs.gate.outputs.number }}
          PR_HEAD: ${{ needs.gate.outputs.head }}
          PR_BASE: ${{ needs.gate.outputs.base }}
          PR_CANDIDATE: ${{ needs.verify.outputs.candidate }}
          PR_TREE: ${{ needs.verify.outputs.tree }}
          BUILD_RUN_ID: ${{ needs.verify.outputs.run_id }}
          BUILD_ATTEMPT: ${{ needs.verify.outputs.attempt }}
          BUILD_ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
        run: node ci/review-receipt.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-receipt.json
          if-no-files-found: error
          retention-days: 7
