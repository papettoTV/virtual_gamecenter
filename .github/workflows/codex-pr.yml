name: Codex PR verification
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
# Holds the shared staging environment through testing and merge; no deployment overlaps.
concurrency:
  group: pulbase-staging-pipeline
  cancel-in-progress: false
jobs:
  gate:
    if: vars.PULBASE_CODEX_ENABLED == 'true' && github.event.pull_request.user.login == vars.PULBASE_AUTOMATION_BOT
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      number: ${{ steps.pr.outputs.number }}
      request: ${{ steps.pr.outputs.request }}
      evidence_only: ${{ steps.pr.outputs.evidence_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        id: pr
        env:
          AUTOMATION_BOT: ${{ vars.PULBASE_AUTOMATION_BOT }}
        with:
          script: |
            const { preparePr } = await import(`${process.env.GITHUB_WORKSPACE}/ci/github.mjs`);
            await preparePr({ github, context, core, bot: process.env.AUTOMATION_BOT });
  verify:
    name: Candidate tests
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.identity.outputs.candidate }}
      tree: ${{ steps.identity.outputs.tree }}
      run_id: ${{ steps.ci.outputs.runId }}
      attempt: ${{ steps.ci.outputs.attempt }}
      artifact_id: ${{ steps.ci.outputs.artifactId }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.gate.outputs.number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable merge parents
        id: identity
        env:
          EXPECTED_BASE: ${{ needs.gate.outputs.base }}
          EXPECTED_HEAD: ${{ needs.gate.outputs.head }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require successful CI artifact for the identical merge candidate
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          PULBASE_CHECK_SHA: ${{ needs.gate.outputs.head }}
          PULBASE_RELEASE_SHA: ${{ steps.identity.outputs.candidate }}
          PULBASE_EXPECTED_BASE: ${{ needs.gate.outputs.base }}
          PULBASE_PR_NUMBER: ${{ needs.gate.outputs.number }}
          PULBASE_CI_EVENT: pull_request
        run: node ci/ci-evidence.mjs
  review:
    needs: [gate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: codex
    outputs:
      result: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare independent review requirements
        env:
          ISSUE_REQUEST: ${{ needs.gate.outputs.request }}
        run: node -e 'const fs = require("fs"); fs.writeFileSync("ci/review-request.md", fs.readFileSync("ci/prompts/review.md", "utf8") + "\nUntrusted issue JSON:\n" + process.env.ISSUE_REQUEST)'
      - uses: openai/codex-action@v1
        id: codex
        env:
          BASE_SHA: ${{ needs.gate.outputs.base }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ci/review-request.md
          allow-users: ${{ vars.PULBASE_AUTOMATION_BOT }}
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-args: '["--output-schema", "ci/schemas/review.json"]'
  review-gate:
    needs: [gate, verify, review]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.base }}
          persist-credentials: false
      - name: Fail closed on malformed or negative review
        env:
          REVIEW_RESULT: ${{ needs.review.outputs.result }}
        run: node --input-type=module -e 'import { assertReview } from "./ci/policy.mjs"; assertReview(JSON.parse(process.env.REVIEW_RESULT))'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: 同じ候補のレビュー証跡を保存
        env:
          REVIEW_RESULT: ${{ needs.review.outputs.result }}
          PR_NUMBER: ${{ needs.gate.outputs.number }}
          PR_HEAD: ${{ needs.gate.outputs.head }}
          PR_BASE: ${{ needs.gate.outputs.base }}
          PR_CANDIDATE: ${{ needs.verify.outputs.candidate }}
          PR_TREE: ${{ needs.verify.outputs.tree }}
          BUILD_RUN_ID: ${{ needs.verify.outputs.run_id }}
          BUILD_ATTEMPT: ${{ needs.verify.outputs.attempt }}
          BUILD_ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
        run: node ci/review-receipt.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-receipt.json
          if-no-files-found: error
          retention-days: 7
  staging:
    needs: [gate, verify, review-gate]
    if: vars.PULBASE_STAGING_DEPLOY_ENABLED == 'true' && needs.gate.outputs.evidence_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked deploy tools without lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: apps/web
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          run-id: ${{ needs.verify.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ci/downloaded-build
          merge-multiple: true
      - name: Recheck CI and deploy artifact without executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PULBASE_DRY_RUN: 'false'
          PULBASE_CHECK_SHA: ${{ needs.gate.outputs.head }}
          PULBASE_RELEASE_SHA: ${{ needs.verify.outputs.candidate }}
          PULBASE_EXPECTED_BASE: ${{ needs.gate.outputs.base }}
          PULBASE_EXPECTED_TREE: ${{ needs.verify.outputs.tree }}
          PULBASE_PR_NUMBER: ${{ needs.gate.outputs.number }}
          PULBASE_CI_EVENT: pull_request
          PULBASE_CI_RUN_ID: ${{ needs.verify.outputs.run_id }}
          PULBASE_CI_ATTEMPT: ${{ needs.verify.outputs.attempt }}
          PULBASE_ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
        run: node ci/deploy-staging-artifact.mjs
  regression:
    needs: [gate, verify, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: ci
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: ci
      - name: HTTP and exact deployed candidate revision
        env:
          PULBASE_CHECK_USERNAME: ${{ secrets.PULBASE_CHECK_USERNAME }}
          PULBASE_CHECK_PASSWORD: ${{ secrets.PULBASE_CHECK_PASSWORD }}
          PULBASE_EXPECTED_SHA: ${{ needs.verify.outputs.candidate }}
        run: |
          mkdir -p ci/results
          node --experimental-strip-types apps/web/scripts/service-check.mjs --environment staging > ci/results/service.json
          node ci/check-revision.mjs staging
      - name: Browser regression on desktop and mobile
        working-directory: ci
        env:
          PULBASE_BROWSER_ENVIRONMENT: staging
          PULBASE_CHECK_USERNAME: ${{ secrets.PULBASE_CHECK_USERNAME }}
          PULBASE_CHECK_PASSWORD: ${{ secrets.PULBASE_CHECK_PASSWORD }}
          PULBASE_EXPECTED_SHA: ${{ needs.verify.outputs.candidate }}
        run: npm run browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-evidence-${{ needs.gate.outputs.head }}
          path: |
            ci/results
            ci/test-results
            ci/playwright-report
          retention-days: 14
          if-no-files-found: warn
  merge:
    needs: [gate, verify, staging, regression]
    if: vars.PULBASE_AUTO_MERGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: automation
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.base }}
          persist-credentials: false
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.PULBASE_APP_ID }}
          private-key: ${{ secrets.PULBASE_APP_PRIVATE_KEY }}
      - name: Merge only the verified head into unchanged develop
        id: merge
        uses: actions/github-script@v7
        env:
          AUTOMATION_BOT: ${{ vars.PULBASE_AUTOMATION_BOT }}
          HEAD_SHA: ${{ needs.gate.outputs.head }}
          BASE_SHA: ${{ needs.gate.outputs.base }}
          VERIFIED_TREE: ${{ needs.verify.outputs.tree }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { mergePr } = await import(`${process.env.GITHUB_WORKSPACE}/ci/github.mjs`);
            const sha = await mergePr({ github, context, head: process.env.HEAD_SHA, base: process.env.BASE_SHA,
              verifiedTree: process.env.VERIFIED_TREE, expectedCheck: 'verify' });
            core.setOutput('sha', sha);
            const { reportMerge } = await import(`${process.env.GITHUB_WORKSPACE}/ci/github.mjs`);
            await reportMerge({ github, context, head: process.env.HEAD_SHA, base: process.env.BASE_SHA, verifiedTree: process.env.VERIFIED_TREE, mergedSha: sha });
  report:
    needs: [gate, verify, review, review-gate, staging, regression, merge]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.evidence_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.base }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const jobs = JSON.parse(process.env.JOB_RESULTS);
            const { report } = await import(`${process.env.GITHUB_WORKSPACE}/ci/github.mjs`);
            await report({ github, context, ok: jobs.regression.result === 'success' && !Object.values(jobs).some(j => j.result === 'failure' || j.result === 'cancelled') });
