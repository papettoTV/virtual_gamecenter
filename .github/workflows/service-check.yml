name: Staging service check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-service-check
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/develop' && github.actor == 'papettoTV'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: setup
        with:
          node-version: '22'
      - name: Read Cloudflare staging metadata without deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ../../ci/staging-preflight.mjs
      - name: Check staging without creating players or spending credits
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          PULBASE_CHECK_USERNAME: ${{ secrets.PULBASE_CHECK_USERNAME }}
          PULBASE_CHECK_PASSWORD: ${{ secrets.PULBASE_CHECK_PASSWORD }}
        run: |
          test -n "$PULBASE_CHECK_USERNAME" && test -n "$PULBASE_CHECK_PASSWORD" || { echo 'Staging check credentials are not configured.'; exit 1; }
          npm run service:check -- --environment staging
