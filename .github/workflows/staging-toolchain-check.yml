name: Staging toolchain checks
on:
  pull_request:
    branches: [develop]
    paths:
      - 'ci/control/**'
      - 'tools/check-pages-metadata.mjs'
      - 'tools/install-automatic-resume-control.py'
      - 'tools/package-automatic-resume-control.py'
      - 'tools/tests/test_install_automatic_resume_control.py'
      - '.github/workflow-templates/postmerge-staging.yml.disabled'
      - '.github/workflows/staging-toolchain-check.yml'
permissions:
  contents: read
jobs:
  verify-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix ci/control/toolchain
      - name: 人用の信頼定義更新を偽APIで確認（鍵・公開なし）
        run: python3 -B -m unittest discover -s tools/tests -p test_install_automatic_resume_control.py
      - name: 実CLIと偽APIで共有設定の保持を確認（実Cloudflare通信なし）
        run: node tools/check-pages-metadata.mjs
      - name: 固定ChromiumとOS依存を取得
        run: node ci/control/toolchain/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: 固定Chromiumだけのuserns許可を設定（sandbox有効のまま）
        run: node ci/control/toolchain/prepare-browser-sandbox.mjs
      - name: 公開鍵なしでsandbox起動だけ確認（アプリ回帰は実施しない）
        run: |
          node --input-type=module <<'JS'
          import {chromium} from './ci/control/toolchain/node_modules/@playwright/test/index.mjs';
          const browser=await chromium.launch({channel:'chromium',chromiumSandbox:true});
          await browser.close();
          JS
